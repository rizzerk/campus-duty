name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # From https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_SHA512 }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "/tmp/$zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$zip"
          echo "${GODOT_SHA512}  /tmp/$zip" | sha512sum -c -
          unzip -q "/tmp/$zip" -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Unit tests
        env:
          GODOT: /home/runner/godot/godot
        run: sh tests/run_tests.sh

      - name: Smoke run (every day)
        env:
          GODOT: /home/runner/godot/godot
        run: sh tests/smoke.sh
